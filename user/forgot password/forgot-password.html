<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0a1a3f" />
    <title>Forgot password AIDEA</title>

    <script>
        (function () {
            var t = null;
            try { t = localStorage.getItem('aidea_user_theme'); } catch (e) { }
            if (t !== 'light' && t !== 'dark') {
                t = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
            }
            document.documentElement.setAttribute('data-theme', t);
        })();
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="forgot-password.css" />
</head>

<body>

    <button class="theme-toggle" id="themeBtn" type="button" aria-label="Switch to dark mode" title="Toggle theme">
        <svg class="i-moon" viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5Z" />
        </svg>
        <svg class="i-sun" viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
            <circle cx="12" cy="12" r="4" />
            <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" />
        </svg>
    </button>

    <div class="auth-wrap">
        <div class="auth-brand">
            <svg viewBox="0 0 32 32" width="30" height="30" fill="none" aria-hidden="true">
                <rect width="32" height="32" rx="9" fill="#FFC72C" />
                <path d="M9 22.5 16 8l7 14.5" stroke="#0a1a3f" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" />
                <path d="M11.8 18h8.4" stroke="#0a1a3f" stroke-width="2.6" stroke-linecap="round" />
                <circle cx="16" cy="8" r="1.9" fill="#2563eb" />
            </svg>
            <span class="brand-text">
                <span class="brand-name">AIDEA</span>
                <span class="brand-sub">Norzagaray College</span>
            </span>
        </div>

        <section class="auth-card" id="requestCard">
            <div class="auth-icon" aria-hidden="true">
                <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="3" y="11" width="18" height="10" rx="2" />
                    <path d="M7 11V8a5 5 0 0 1 10 0v3" />
                </svg>
            </div>
            <h1 class="auth-title">Forgot your password?</h1>
            <p class="auth-text">Enter the email on your account and we'll send you a link to reset it.</p>

            <form id="forgotForm" novalidate>
                <div class="form-group">
                    <label for="email">Email address</label>
                    <input type="email" id="email" name="email" autocomplete="email" placeholder="you@example.com" required />
                    <span class="field-error" id="emailError"></span>
                </div>

                <button class="btn-auth" id="sendBtn" type="submit">
                    <span class="spinner" aria-hidden="true"></span>
                    <span class="btn-label">Send reset link</span>
                </button>
            </form>

            <a class="auth-back" href="../login/login.html">
                <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M19 12H5M11 18l-6-6 6-6" />
                </svg>Back to sign in
            </a>
        </section>

        <section class="auth-card" id="confirmCard" hidden>
            <div class="auth-icon is-success" aria-hidden="true">
                <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M3 7l9 6 9-6" />
                    <rect x="3" y="5" width="18" height="14" rx="2" />
                </svg>
            </div>
            <h1 class="auth-title">Check your email</h1>
            <p class="auth-text">We sent a password reset link to <strong id="sentEmail"></strong>. Follow the link to choose a new password.</p>

            <button class="btn-secondary" id="backToLoginBtn" type="button">Back to sign in</button>

            <div class="resend-row">
                <span>Didn't get it?</span>
                <button class="resend-link" id="resendBtn" type="button">Resend email</button>
            </div>
        </section>
    </div>

    <script src="forgot-password.js"></script>
</body>

</html>
